name: CI
on:
  push:
jobs:
  scala:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v9
    - uses: actions/setup-java@v6
      with:
        distribution: corretto
        java-version: 17
    - uses: sbt/setup-sbt@v1
    - run: sbt -v test

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v9
    - uses: actions/setup-java@v6
      with:
        distribution: corretto
        java-version: 17
    - uses: sbt/setup-sbt@v1
    - run: sbt -v "scalafmtCheckAll; scalafmtSbtCheck"
